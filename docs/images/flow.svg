<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="680" height="420" fill="#f7f8fc"/>
  <text x="40" y="36" font-size="14" font-weight="500" fill="#111827">注册流程 · 6 步</text>

  <defs>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#9ca3af" stroke-width="1"/>
    </marker>
  </defs>

  <!-- row 1 -->
  <rect x="40" y="60" width="280" height="44" rx="8" fill="#fff" stroke="#d1d5db" stroke-width="0.5"/>
  <text x="180" y="87" text-anchor="middle" font-size="12" fill="#111827">1. 打开 chatgpt.com（处理 Cloudflare）</text>

  <rect x="360" y="60" width="280" height="44" rx="8" fill="#fff" stroke="#d1d5db" stroke-width="0.5"/>
  <text x="500" y="87" text-anchor="middle" font-size="12" fill="#111827">2. Sign up · 提交邮箱</text>

  <!-- row 2 -->
  <rect x="360" y="130" width="280" height="44" rx="8" fill="#fff" stroke="#d1d5db" stroke-width="0.5"/>
  <text x="500" y="157" text-anchor="middle" font-size="12" fill="#111827">3. 密码 / 切到一次性验证码</text>

  <rect x="40" y="130" width="280" height="44" rx="8" fill="#2563eb" stroke="#1d4ed8" stroke-width="0.5"/>
  <text x="180" y="157" text-anchor="middle" font-size="12" fill="#fff">4. 收邮箱 OTP 并填入</text>

  <!-- row 3 -->
  <rect x="40" y="200" width="280" height="44" rx="8" fill="#fff" stroke="#d1d5db" stroke-width="0.5"/>
  <text x="180" y="227" text-anchor="middle" font-size="12" fill="#111827">5. 姓名 / 生日资料</text>

  <rect x="360" y="200" width="280" height="44" rx="8" fill="#fff" stroke="#d1d5db" stroke-width="0.5"/>
  <text x="500" y="227" text-anchor="middle" font-size="12" fill="#111827">6. 等注册完成</text>

  <!-- arrows snake -->
  <line x1="320" y1="82" x2="360" y2="82" stroke="#9ca3af" stroke-width="1" marker-end="url(#a2)"/>
  <line x1="500" y1="104" x2="500" y2="130" stroke="#9ca3af" stroke-width="1" marker-end="url(#a2)"/>
  <line x1="360" y1="152" x2="320" y2="152" stroke="#9ca3af" stroke-width="1" marker-end="url(#a2)"/>
  <line x1="180" y1="174" x2="180" y2="200" stroke="#9ca3af" stroke-width="1" marker-end="url(#a2)"/>
  <line x1="320" y1="222" x2="360" y2="222" stroke="#9ca3af" stroke-width="1" marker-end="url(#a2)"/>

  <!-- outputs -->
  <rect x="40" y="290" width="280" height="56" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="0.5"/>
  <text x="180" y="314" text-anchor="middle" font-size="12" fill="#065f46">写入 MySQL</text>
  <text x="180" y="332" text-anchor="middle" font-size="11" fill="#047857">email · session · 密码(Fernet)</text>

  <rect x="360" y="290" width="280" height="56" rx="8" fill="#eef2ff" stroke="#a5b4fc" stroke-width="0.5"/>
  <text x="500" y="314" text-anchor="middle" font-size="12" fill="#312e81">可选：Codex OAuth</text>
  <text x="500" y="332" text-anchor="middle" font-size="11" fill="#4338ca">OTP → 凭据 → 推送 SUB2API</text>

  <line x1="500" y1="244" x2="500" y2="290" stroke="#9ca3af" stroke-width="1" marker-end="url(#a2)"/>
  <line x1="180" y1="244" x2="180" y2="290" stroke="#9ca3af" stroke-width="1" marker-end="url(#a2)"/>
</svg>
